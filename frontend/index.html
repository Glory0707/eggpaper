<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eggpaper</title>
    <meta name="theme-color" content="#1d4e5f" />
    <!-- 图标：浏览器标签、独立窗口（Edge 应用模式）的标题栏、任务栏、"安装为应用"都用这几份。
         **每个尺寸一张原图**（tools/make_icon.py 按目标尺寸现画）——Chromium 挑图标是
         "按需要的尺寸找最接近的一张再缩放"，少给几档它就得重采样，小尺寸上就是糊。
         这里曾经挂过一条内联 SVG（旧几何、缝不到 1.2px），Chromium 会把它栅格化成小位图再放大，
         任务栏那坨糊一直是它——别再加回来。
         ?v= 是给浏览器图标缓存留的把手：换了图标就把它加一。 -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=2" />
    <link rel="icon" type="image/png" sizes="24x24" href="/icons/icon-24.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png?v=2" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/icon-64.png?v=2" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icons/icon-256.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png?v=2" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

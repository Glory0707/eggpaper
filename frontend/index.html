    <!-- 图标：浏览器标签、独立窗口（Edge 应用模式）的标题栏、任务栏、"安装为应用"都用这几份。
         **每一档 DPI 的精确物理尺寸都有一张原图**（tools/make_icon.py 的 ICO_SIZES 注释：
         150% 缩放下任务栏要 30px，缺这档它就拿 32/24 缩放，看着就是糊的）。
         应用模式窗口在 Windows 上主要取 favicon.ico；PNG 给标签页与"安装为应用"。
         ?v= 由 build_installer.py 在发版时替换成版本号：浏览器按 URL 缓存图标，不换 URL 不重取。 -->
